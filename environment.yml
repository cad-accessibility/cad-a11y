name: cad-a11y
channels:
  - conda-forge
# Every Python package conda installs here that the packages in
# requirements-lock.txt also need is pinned, and none of them is in that file,
# so pip finds each one already satisfied and nothing is installed twice (#240).
# numpy used to be: conda installed 2.5.1 and pip replaced it with 2.5.3.
# Changing a version here means checking it against requirements-lock.txt.
dependencies:
  - python=3.12
  - pythonocc-core=7.9.3
  - pip
  - numpy=2.5.3
  - matplotlib=3.11.2
  - pillow=12.3.0
  # What matplotlib and pythonocc-core bring with them, at the versions staging
  # runs, so the environment does not change when it is solved again.
  - contourpy=1.3.3
  - cycler=0.12.1
  - fonttools=4.63.0
  - idna=3.18
  - kiwisolver=1.5.0
  - packaging=26.3
  - pyparsing=3.3.2
  - python-dateutil=2.9.0.post0
  - six=1.17.0
  - svgwrite=1.4.3
  - typing_extensions=4.16.0
