stages:
  - deploy

deploy_research_test:
  stage: deploy
  script:
    - docker compose up -d --build
    # `up -d` returns once the container is created, not once the app works, so
    # without this the job goes green on a site that is returning 503.
    - bash scripts/wait_for_deploy.sh https://cada11y-test.cs.washington.edu/
  environment:
    name: research test
    url: https://cada11y-test.cs.washington.edu
  tags:
    - lab-docker-test
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

deploy_research_prod:
  stage: deploy
  script:
    - docker compose up -d --build
    - bash scripts/wait_for_deploy.sh https://cada11y.cs.washington.edu/
  environment:
    name: research prod
    url: https://cada11y.cs.washington.edu
  tags:
    - lab-docker-prod
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
