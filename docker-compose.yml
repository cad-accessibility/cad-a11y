services:
  app:
    build:
      context: .
      # Override with `DOCKERFILE=Dockerfile.legacy docker compose up -d --build`
      # on a host whose Docker is too old for BuildKit cache mounts — the main
      # Dockerfile uses `RUN --mount=type=cache`, which older Docker fails to
      # parse at all.
      dockerfile: ${DOCKERFILE:-Dockerfile}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8635}:6969"
    env_file:
      - path: .env
        required: false
    environment:
      SERVER_VERBOSE: "${SERVER_VERBOSE:-0}"
      # Set explicitly rather than left to the server's writability probing.
      # Uploads must never land in data/models: that directory is the built-in
      # set and everything in it is public to every visitor (#102).
      UPLOAD_MODEL_DIR: /project/data/uploads
      # The release or commit being deployed, recorded with every study
      # session. scripts/docker_compose_build.sh sets it from the pipeline; the
      # image has no .git to ask.
      CAD_A11Y_VERSION: "${CAD_A11Y_VERSION:-}"
      # Draft studies to serve, by slug, comma-separated. For development and
      # CI only: CI opens the example study here for the accessibility check.
      # Whether a real study runs is its status in app/studies/definitions,
      # which this cannot change.
      CAD_A11Y_OPEN_STUDIES: "${CAD_A11Y_OPEN_STUDIES:-}"
    volumes:
      # Docker-managed named volumes (not host bind mounts). On first mount,
      # Docker seeds each volume from the image's /project/data/<name>, which
      # the Dockerfile already chowns to UID 48 (apache) before USER apache —
      # so the app can write immediately without relying on host/NFS
      # permissions being configured for UID 48.
      - models:/project/data/models
      - uploads:/project/data/uploads
      - renders:/project/data/renders
      - logs:/project/data/logs
      - db:/project/data/db
    healthcheck:
      # /health rather than / — the root answers even when storage is
      # misconfigured or the database cannot be opened, which is how a broken
      # deploy previously looked healthy. /health returns 503 in those cases.
      test: ["CMD", "curl", "-f", "http://localhost:6969/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  models:
  uploads:
  renders:
  logs:
  db:
