name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          environment-name: cad-a11y
          cache-environment: true
          cache-downloads: true

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            libhidapi-hidraw0 libhidapi-dev libgl1 libglib2.0-0 libxrender1

      - name: Install pip dependencies
        shell: bash -l {0}
        run: |
          grep -vE '^\s*(#|polyscope)' requirements.txt \
            | micromamba run -n cad-a11y pip install --no-cache-dir -r /dev/stdin
          micromamba run -n cad-a11y pip install --no-cache-dir polyscope || true
          micromamba run -n cad-a11y pip install --no-cache-dir pytest ruff

      - name: Lint (errors only)
        shell: bash -l {0}
        run: |
          micromamba run -n cad-a11y ruff check . --select E9,F63,F7,F82

      - name: Run tests
        shell: bash -l {0}
        run: |
          micromamba run -n cad-a11y pytest -q; code=$?; [ $code -eq 0 ] || [ $code -eq 5 ]

  axe-accessibility:
    runs-on: ubuntu-latest
    # Every compose command in this job reads both files. The second opens the
    # example study, a draft no server runs, so its pages go through the same
    # checks as the viewer; its token is published, which is why only this job
    # and a development machine pass the variable that allows it.
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.example-study.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set data directory permissions for container user (UID 48)
        run: |
          mkdir -p data/db data/renders data/logs
          sudo chown -R 48:48 data/db data/renders data/logs

      - name: Start app with Docker Compose
        run: docker compose up -d --build

      - name: Wait for app to be ready
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8635/ >/dev/null; then
              echo "App is up"
              exit 0
            fi
            sleep 2
          done
          echo "App failed to start"
          docker compose logs
          exit 1

      - name: Install axe dependencies
        run: |
          npm install --no-save playwright @axe-core/playwright
          npx playwright install chromium

      - name: Run axe check and console-error smoke test against home page
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          const AxeBuilder = require('@axe-core/playwright').default;

          (async () => {
            const browser = await chromium.launch();
            const context = await browser.newContext();
            const page = await context.newPage();

            // No hardware is attached in CI, so this also guards the "device not
            // connected" code paths (e.g. handlers wired up against elements or
            // functions that no longer exist) that only fail at runtime and are
            // invisible to node --check or the Python test suite.
            const consoleErrors = [];
            page.on('console', (msg) => {
              if (msg.type() === 'error') consoleErrors.push(msg.text());
            });
            page.on('pageerror', (err) => consoleErrors.push(err.message));

            // The study pages are checked as well as the viewer, and in the
            // states they are actually used in: the panel before sign-in, the
            // participant page waiting for a code and in a session, and the
            // panel choosing a task set and running one. The example study is
            // the one CI opens; its panel token is published for that reason
            // (app/studies/definitions/example.py).
            const base = 'http://localhost:8635';
            const study = `${base}/studies/example`;
            const signIn = async () => {
              await page.goto(`${study}/control`, { waitUntil: 'domcontentloaded' });
              return page.evaluate(async (control) => {
                const signedIn = await fetch(`${control}/sign-in`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ token: 'example-panel-token' }),
                });
                if (!signedIn.ok) throw new Error(`sign-in failed: ${signedIn.status}`);
                const res = await fetch(`${control}/session/start`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: '{}',
                });
                return (await res.json()).state;
              }, `${study}/control`);
            };

            // The panel remembers its session in sessionStorage, not in the URL,
            // so a fresh tab always opens on the task-set picker. Both of its
            // states are checked: the picker, and the running session reached
            // by choosing a set from it.
            let started = null;
            const pages = [
              { name: '/viewer', url: () => `${base}/viewer` },
              { name: '/studies/example/control (signing in)', url: () => `${study}/control` },
              {
                name: '/studies/example (waiting for a code)',
                before: async () => { started = await signIn(); },
                url: () => study,
              },
              { name: '/studies/example (in a session)', url: () => `${study}?s=${started.participant_key}` },
              { name: '/studies/example/control (choosing a task set)', url: () => `${study}/control` },
              {
                name: '/studies/example/control (running a session)',
                url: () => `${study}/control`,
                after: async () => {
                  await page.click('#set-list button');
                  await page.waitForSelector('#session-section:not([hidden])');
                },
              },
            ];

            let failed = false;
            for (const target of pages) {
              if (target.before) await target.before();
              consoleErrors.length = 0;
              await page.goto(target.url(), { waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(2000);
              if (target.after) await target.after();

              if (consoleErrors.length > 0) {
                console.error(`Console/page errors found on ${target.name}:`);
                for (const message of consoleErrors) {
                  console.error(`- ${message}`);
                }
                failed = true;
              }

              const results = await new AxeBuilder({ page }).analyze();
              const blocking = results.violations.filter((v) =>
                ['serious', 'critical'].includes(v.impact)
              );

              if (blocking.length > 0) {
                console.error(`Axe found serious/critical violations on ${target.name}:`);
                for (const violation of blocking) {
                  console.error(`- ${violation.id} (${violation.impact}): ${violation.help}`);
                  for (const node of violation.nodes) {
                    console.error(`  target: ${node.target.join(', ')}`);
                  }
                }
                failed = true;
              }

              if (!failed) console.log(`ok: ${target.name}`);
            }

            if (failed) {
              await browser.close();
              process.exit(1);
            }

            console.log('Console-error and axe checks passed on every page: no console errors, no serious or critical a11y violations.');
            await browser.close();
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          EOF

      - name: Print Docker logs on failure
        if: failure()
        run: docker compose logs
